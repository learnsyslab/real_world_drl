[workspace]
preview = ["pixi-build"]
authors = ["Luka Hofer <luka.hofer@tum.de>"]
channels = [
    "https://fast.prefix.dev/conda-forge",
    "https://conda.anaconda.org/pytorch",
    "https://conda.anaconda.org/nvidia",
]
name = "rl-manipulation-base"
version = "0.1.0"
platforms = ["linux-64"]

[activation]
scripts = ["set_ros_env.sh"]

[system-requirements]
cuda = "12.0"

[dependencies]
python = ">=3.11.13,<3.12"
pip = "*"
compilers = ">=1.9.0,<2"
cmake = ">=4.0.3,<5"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ninja = ">=1.12.1,<2"
typing_inspect = ">=0.9.0,<0.10"
libstdcxx-ng = ">=15.1.0,<16"
datasets = ">=3.6.0,<4"
joblib = ">=1.2,<2"
pytorch-cuda = "==12.4"          # CUDA 12.x compatible

[target.linux.dependencies]
libgl-devel = "*"

[environments]
dev = { features = ["dev"] }
humble = { features = ["humble"] }
humble-tensorrt = { features = ["humble", "tensorrt"] }
humble-lerobot = { features = ["humble", "lerobot"] }
lerobot = { features = ["lerobot"] }

[feature.dev.pypi-dependencies]
pre-commit = "*"
ruff = "*"


[feature.lerobot.pypi-dependencies]
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "dacd1d7f5c719c3e56d7b7154a751bef6d5bd23c", extras = [
    "smolvla",
] }
rich = ">=14.0.0, <15"
triton = "==3.5.1"

[feature.tensorrt.dependencies]
pytorch = "==2.5.0"

[feature.tensorrt.pypi-dependencies]
torch-tensorrt = "==2.5.0"
torchvision = "*"
nvidia-modelopt = "*"


[feature.lerobot.dependencies]
pynput = "*"
rerun-sdk = "==0.22.0"
python = ">=3.11.13,<3.14"


[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
rosdep = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
pinocchio = ">=3.4.0,<4"
tsid = ">=1.8.0,<2"
# [tool.pixi.dependencies]

[pypi-dependencies]
crisp_drl = { path = ".", editable = true }
# torch = "*"
crisp_gym = { path = "../crisp_gym", editable = true }
crisp_python = { path = "../crisp_py", editable = true }
tensorboard = ">=2.20.0, <3"
gymnasium = { version = ">=0.29.1, <2", extras = ["classic-control"] }
mujid = { path = "../mujid", editable = true }


[tasks]
configure = "bash scripts/configure.sh"
