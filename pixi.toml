[workspace]
preview = ["pixi-build"]
authors = ["Luka Hofer <luka.hofer@tum.de>"]
channels = ["https://fast.prefix.dev/conda-forge"]
name = "rl-manipulation-base"
version = "0.1.0"
platforms = ["linux-64"]

[activation]
scripts = [
    "set_ros_env.sh",
]

[system-requirements]
cuda = "12.0"

[dependencies]
python = ">=3.11.13,<3.14"
compilers = ">=1.9.0,<2"
cmake = ">=4.0.3,<5"
pkg-config = ">=0.29.2,<0.30"
make = ">=4.4.1,<5"
ninja = ">=1.12.1,<2"
typing_inspect = ">=0.9.0,<0.10"
libstdcxx-ng = ">=15.1.0,<16"
datasets = ">=3.6.0,<4"

[target.linux.dependencies]
libgl-devel = "*"

[environments]
dev = { features = ["dev"] }
humble = { features = ["humble"] }
humble-lerobot = { features = ["humble", "lerobot"] }
lerobot = { features = ["lerobot"] }
jazzy = { features = ["jazzy"] }
jazzy-lerobot = { features = ["jazzy", "lerobot"] }

[feature.dev.pypi-dependencies]
pre-commit = "*"
ruff = "*"

[feature.lerobot.pypi-dependencies]
# lerobot = { path = "../lerobot", editable = false }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "dacd1d7f5c719c3e56d7b7154a751bef6d5bd23c", extras = ["smolvla"]}
# lerobot = "*"
rich = ">=14.0.0, <15"

[feature.lerobot.dependencies]
pynput = "*"
rerun-sdk = "==0.22.0"

[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
rosdep = "*"
ros-humble-rmw-cyclonedds-cpp = "*"

[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
colcon-common-extensions = "*"
rosdep = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"

[pypi-dependencies]
rlmb = { path = ".", editable = true }
torch = { version = ">=2.8.0, <3", index = "https://download.pytorch.org/whl/cu126" }
torchvision = { version = ">=0.23.0, <0.24", index = "https://download.pytorch.org/whl/cu126" }
crisp_gym = { path = "../crisp_gym", editable = false }
tensorboard = ">=2.20.0, <3"
gymnasium = { version = ">=0.29.1, <2", extras = ["classic-control"] }

[tasks]
configure = "bash scripts/configure.sh"
