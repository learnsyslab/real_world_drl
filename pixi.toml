[workspace]
authors = ["Luka Hofer <luka.hofer@tum.de>"]
channels = ["conda-forge"]
name = "rl-manipulation-base"
platforms = ["linux-64"]
version = "0.1.0"
preview = ["pixi-build"]

[activation]
scripts = ["set_ros_env.sh"]

[system-requirements]
cuda = "12.0"

[dependencies]
python = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"

[pypi-dependencies]
torch = { version = ">=2.5.1", index = "https://download.pytorch.org/whl/cu126" }
crisp_gym = { path = "../crisp_gym", editable = false }
tensorboard = "*"
gymnasium = { version = "*", extras = ["classic_control"] }
rlmb = { path = ".", editable = true }

[target.linux.dependencies]
libgl-devel = "*"

[environments]
humble = { features = ["humble"] }
jazzy = { features = ["jazzy"] }

# humble
[feature.humble]
channels = ["https://prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
colcon-common-extensions = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
rosdep = "*"

# jazzy
[feature.jazzy]
channels = ["https://prefix.dev/robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-desktop = "*"
ros-jazzy-ros2-control = "*"
ros-jazzy-ros2-controllers = "*"
colcon-common-extensions = "*"
rosdep = "*"


